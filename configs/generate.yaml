# Synthetic image generation (tinyseek.generate.sample).
# Output: data/synthetic/<prompt>/<synth_set>/{000000.jpg, ..., metadata.jsonl, config.yaml}
seed: 0
prompt: cup
data_root: data
synth_set: sd15_lcm_esp32v2        # bump the suffix whenever generation settings change

base_model: stable-diffusion-v1-5/stable-diffusion-v1-5
# Few-step sampling: Pascal GPUs have no fast fp16, so generation runs in fp32 and
# LCM-LoRA (4-8 steps) is what makes thousands of images per prompt affordable.
lcm_lora: latent-consistency/lcm-lora-sdv1-5
# ESP32-camera LoRA, picked with tinyseek.generate.compare_lora (32 images per object, CLIP
# similarity to 508 real camera photos; OWLv2 found-rate person/cup/backpack):
#   plain SD                0.625   0.50/0.84/0.81
#   v1 step 500  x0.6       0.669   0.53/0.84/0.53
#   v2 step 2000 x0.8       0.748   0.44/0.91/0.69   <- default
# v2 (configs/lora_v2.yaml) draws people less often (few people in its photos), so person keeps v1.
domain_lora: runs/lora/esp32cam_v2/checkpoint-2000
domain_lora_scale: 0.8
domain_trigger: esp32cam photo    # caption prefix the domain LoRA was trained with

num_images: 2000
resolution: 512
steps: 6
guidance_scale: 1.5               # LCM works best with little or no CFG
batch_size: 4
dtype: float32
negative_prompt: "cartoon, drawing, illustration, text, watermark, deformed"

# Per-prompt changes, merged over the settings above when prompt=<key>.
prompt_overrides:
  person:
    domain_lora: runs/lora/esp32cam_v1/checkpoint-500
    domain_lora_scale: 0.6
