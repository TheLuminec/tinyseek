# Three synthetic sets together (e.g. two Qwen sets and a Z-Image set), synthetic only, scored on
# the backpack test sessions 013/014. Pass synth_set=<a> synth_set_b=<b> synth_set_c=<c> label_variant="".
base: heldout_013_014_synth2.yaml
condition: heldout_synth3
synth_set_c: zimage_turbo_far_v1_only_tone
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "labels/{teacher}/synth_{synth_set_b}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set_b}"}
    - {ann: "labels/{teacher}/synth_{synth_set_c}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set_c}"}
