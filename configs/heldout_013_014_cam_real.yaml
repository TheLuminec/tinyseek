# Synthetic set + camera photos from the other reviewed sessions + real COCO images, scored on
# the backpack test sessions 013/014. Pass synth_set=<set> label_variant="".
base: heldout_013_014_cam.yaml
condition: heldout_cam_real
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "esp32cam/reviewed_labels_no013_014.json", images: esp32cam/raw, repeat: "{cam_repeat}"}
    - {ann: "coco/subsets/train2017_{prompt}.json", images: coco/train2017}
