# Person: synthetic set + camera photos outside 006/011 (472 photos, 72 person boxes) + real
# COCO images, scored on 006/011. Pass synth_set=<set> label_variant="".
base: heldout_person_006_011.yaml
condition: heldout_person_cam_real
cam_repeat: 1
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "esp32cam/reviewed_labels_no006_011.json", images: esp32cam/raw, repeat: "{cam_repeat}"}
    - {ann: "coco/subsets/train2017_{prompt}.json", images: coco/train2017}
