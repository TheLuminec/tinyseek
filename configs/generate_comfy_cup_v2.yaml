  cup:
    subject:
      - A white ceramic mug
      - A blue coffee mug
      - A teal ceramic mug
      - A black mug
      - A yellow mug
      - A grey stoneware mug
      - A striped mug
      - A red plastic party cup
      - A blue plastic party cup
      - A green plastic cup
      - A clear drinking glass
      - A tall glass of water
      - A glass tumbler half full of orange juice
      - A paper takeaway coffee cup with a lid
      - A plain white paper cup
      - A stainless steel travel mug
      - A clear plastic cup with a straw
      - A frosted plastic tumbler
      - A pair of coffee mugs side by side
      - A pair of red plastic party cups
      - A group of three plastic cups in different colours
      - A row of three drinking glasses
      - A mug with a paper cup next to it
