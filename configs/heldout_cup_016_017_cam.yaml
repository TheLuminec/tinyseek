# Cup: synthetic set plus camera photos from the other reviewed sessions (everything except
# the cup test sessions 016/017: 479 photos, 280 cup boxes), scored on 016/017.
# Pass synth_set=<set> label_variant="" (and cam_repeat=<n>).
base: heldout_cup_016_017.yaml
condition: heldout_cup_cam
cam_repeat: 1
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "esp32cam/reviewed_labels_no016_017.json", images: esp32cam/raw, repeat: "{cam_repeat}"}
