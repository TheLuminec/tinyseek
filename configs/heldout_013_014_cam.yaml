# Synthetic set plus camera photos from the other reviewed sessions (all of 005-017 except
# the backpack test sessions 013/014), scored on 013/014 as in heldout_013_014.yaml.
# The camera photos bring the deployment domain: few backpacks (24 boxes) but 363 photos of
# the same lens, light and rooms, so mostly in-domain negatives. cam_repeat oversamples them.
# Pass synth_set=<set> label_variant="" (and cam_repeat=<n>).
base: heldout_013_014.yaml
condition: heldout_cam
cam_repeat: 1
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "esp32cam/reviewed_labels_no013_014.json", images: esp32cam/raw, repeat: "{cam_repeat}"}
