# Two synthetic sets plus real COCO images, scored on the held-out camera sessions.
# Pass synth_set=<a> synth_set_b=<b> label_variant="".
base: heldout_013_014_synth2.yaml
condition: heldout_synth2_real
train:
  sources:
    - {ann: "labels/{teacher}/synth_{synth_set}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set}"}
    - {ann: "labels/{teacher}/synth_{synth_set_b}_{prompt}_t{teacher_threshold}{label_variant}.json", images: "synthetic/{prompt}/{synth_set_b}"}
    - {ann: "coco/subsets/train2017_{prompt}.json", images: coco/train2017}
