# Synthetic images from a ComfyUI server (tinyseek.generate.comfy).
# Output: data/synthetic/<prompt>/<synth_set>/{000000.jpg, ..., metadata.jsonl, config.yaml, workflow.json}
#
# The model draws ordinary, unstaged scenes with no camera effects; the ESP32 camera's look
# (distortion, tone, noise) is added afterwards by tinyseek.generate.camsim, which also moves
# the teacher's boxes.
seed: 0
prompt: backpack
data_root: data
# Bump the suffix whenever the workflow or the text below changes. The first text (24+8 pilot
# images, set qwen21_turbo_pilot, 2026-11-12) placed and framed the object as asked but drew
# nearly every room as the same bare cream office; v2 describes each room's walls, floor and
# furniture, varies the camera position, and drops "webcam" and "dull colours".
synth_set: qwen21_turbo_v2
num_images: 1000

server: http://127.0.0.1:8188      # or set TINYSEEK_COMFY_URL
workflow: configs/comfy/qwen_image_2.1_turbo.json   # API-format graph: 8 steps, cfg 1, euler
model: qwen-image-2.1-turbo (int8 weights on the server)
# Licence as reported by whoever installed the model on the server; not checked against the model card here.
model_licence: qwen-research (research / non-commercial)
# Where each per-image value goes in the workflow: [node id, input name].
workflow_inputs:
  text: [text, prompt]
  seed: [noise, noise_seed]
  width: [latent, width]
  height: [latent, height]
output_node: image
# Sampling time scales with the frame: ~62 s per image at 1184x896 (the size the model was run
# at interactively) and ~33 s at 896x672 on the GTX 1080 Ti. Reloading the models is not the
# cost: one job of 8 prompts took 61.9 s per image against 62.0 s as single jobs.
width: 896
height: 672
save_width: 800                    # stored at the camera's frame size (800x600); null keeps the full size
images_per_job: 1
timeout_s: 900

# One paragraph per image; every {field} is drawn from the lists below with the image's seed.
template: >-
  An ordinary, unremarkable snapshot of {location}. The picture was taken by a small camera
  {viewpoint}, not aimed at anything in particular. {subject} {placement}. It is {framing}.
  The place is lived-in and a little messy, with {clutter}. {lighting}. Plain wide-angle view
  with the whole scene in the same slightly soft focus and no background blur, neutral white
  balance, natural colours. Casual and unstaged, not a product photo or a stock photo. No
  people, no text, no watermark.

fields:
  location:
    - a student bedroom with posters on a pale blue wall, an unmade bed and a wooden floor
    - a small home office with dark wood panelling, a bookcase and a patterned rug
    - a living room with a brown sofa, a television and a red brick fireplace wall
    - a kitchen with wooden cabinets, a tiled floor and a dining table
    - a hallway by the front door with a staircase, a dark green wall and a doormat
    - a university classroom with rows of desks, a projector screen and grey carpet
    - a library study area with tall wooden bookshelves and long tables
    - an open-plan office with cubicle partitions and blue carpet
    - a garage workshop with a concrete floor, bare block walls and a workbench
    - a dorm room with a bunk bed, a cluttered desk and a small fridge
    - a break room with vending machines, a tiled floor and plastic chairs
    - a basement storage room with exposed pipes, metal shelving and a concrete floor
    - a laundry room with a washing machine, a drying rack and yellow walls
    - an electronics lab with long benches, stools and equipment on shelves
    - a building lobby with benches, large windows and a polished stone floor
    - a child's bedroom with a colourful rug, toy boxes and patterned wallpaper
  viewpoint:
    - left on a table at about desk height, tilted slightly down
    - left on a low shelf near the floor, looking across the room
    - placed on a high shelf, looking down across the room
    - sitting on a windowsill at chest height
  framing:
    - small in the picture and well off to the left side
    - small in the picture and well off to the right side
    - medium-sized and off-centre, in the lower half of the picture
    - far away at the back of the room, taking up only a small part of the picture
    - close to the camera and partly cut off by the left edge of the frame
    - close to the camera and partly cut off by the bottom edge of the frame
    - partly hidden behind a chair leg and other objects
    - medium-sized and near the right edge of the picture
    - roughly in the middle distance, not the focus of the picture
  clutter:
    - cables, papers, a jacket over a chair and a couple of cardboard boxes
    - shoes, a laundry basket, books and a charger on the floor
    - a monitor, a keyboard, mugs and stacks of paper
    - chairs pushed in at odd angles, a bin and a noticeboard
    - shelves of boxes, tools and plastic tubs
    - folded clothes, a fan, a lamp and an open drawer
    - grocery bags, a coat rack and an umbrella
    - plants, a pile of magazines, a blanket and a pair of slippers
    - sports gear, a bicycle helmet, a water bottle and a towel
  lighting:
    - Lit by ordinary ceiling lights at night
    - Daylight comes from a window on one side, and the window itself is overexposed
    - Dim evening light from a single lamp
    - Flat fluorescent ceiling lighting
    - Overcast daylight, a little dim
    - Mixed daylight and ceiling light, uneven across the room

# Per-object fields, merged over `fields` for prompt=<key>.
objects:
  backpack:
    subject:
      - A black nylon backpack
      - A grey school backpack
      - A navy blue backpack with a front pocket
      - A red hiking backpack
      - An olive green canvas backpack
      - A tan rucksack with buckled straps
      - A faded blue daypack
      - A black laptop backpack with mesh side pockets
      - A bright yellow child's backpack
      - A dark green backpack with a water bottle in its side pocket
      - A purple backpack
      - A large camping backpack
    placement:
      - is lying on its side on the floor
      - is leaning against the wall on the floor
      - is sitting on the seat of a chair
      - is hanging from the back of a chair
      - is on a table among other things
      - is on the floor next to a table leg
      - is hanging from a hook on the wall
      - is lying half open on the floor with things spilling out
      - is on a low shelf
      - is slumped in a corner of the room
  cup:
    subject:
      - A white ceramic mug
      - A blue coffee mug
      - A clear drinking glass
      - A paper takeaway coffee cup with a lid
      - A red plastic cup
      - A stainless steel travel mug
      - A black mug
      - A striped mug
      - A small espresso cup on a saucer
      - A frosted plastic tumbler
    placement:
      - is on a table
      - is on the edge of a desk next to a keyboard
      - is on a shelf
      - is on a windowsill
      - is on a counter
      - is on the floor next to a chair
      - is on a stack of books
