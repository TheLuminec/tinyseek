[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyseek"
version = "0.1.0"
description = "Synthetic-data distillation of prompt-specific object detectors for the ESP32-S3."
readme = "README.md"
requires-python = ">=3.10"
# torch/torchvision are installed separately so the CUDA build can be chosen
# per machine (see README).
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "pycocotools>=2.0.8",
    "timm>=1.0",
]

[project.optional-dependencies]
generate = ["diffusers>=0.35", "transformers>=4.56", "accelerate>=1.0", "peft>=0.17", "safetensors"]
label = ["transformers>=4.56", "accelerate>=1.0"]
export = ["onnx>=1.17", "esp-ppq>=1.3"]
eval = ["matplotlib>=3.8", "open_clip_torch>=2.24"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["tinyseek*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
